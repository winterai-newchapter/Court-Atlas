<div class="page-head">
  <p class="eyebrow">Rankings of September 28, 2026</p>
  <h1>Players</h1>
  <p>The current top 10 on each tour. Select a card for the player’s profile and their 2026 finals in the tournaments this site covers.</p>
</div>

<section>
  <div class="seg ptabs" id="pSeg" role="group" aria-label="Tour">
    <button id="p-all" aria-pressed="true" data-v="all">ATP &amp; WTA</button>
    <button id="p-atp" aria-pressed="false" data-v="ATP">ATP men</button>
    <button id="p-wta" aria-pressed="false" data-v="WTA">WTA women</button>
  </div>
  <div id="playerGrid"></div>
  <div class="panel pdetail" id="pdetail"></div>
</section>

<script>
let pTour = 'all', pSel = null;
const TOURNAME = {ATP:'ATP men', WTA:'WTA women'};
function finals(p){
  const out = [];
  T.forEach(t => t.res.forEach(r => {
    if (r.w === p.n) out.push({t, won:true, o:r.r, sc:r.sc});
    else if (r.r === p.n) out.push({t, won:false, o:r.w, sc:r.sc});
  }));
  return out.sort((a,b) => d(a.t.s) - d(b.t.s));
}
function render(){
  const tours = pTour === 'all' ? ['ATP','WTA'] : [pTour];
  const ps = tours.flatMap(t => PLAYERS[t].map(p => ({...p, tour:t})));
  if (!ps.find(p => p.n === pSel)) pSel = ps[0].n;
  if ($('#playerGrid').contains($('#pdetail'))) $('#playerGrid').after($('#pdetail'));
  $('#playerGrid').innerHTML = tours.map(t => `${tours.length > 1 ? `<h2 class="grouph">${TOURNAME[t]}</h2>` : ''}<div class="players" data-tour="${t}">${ps.filter(p => p.tour === t).map(p => {
    const w = finals(p).filter(x => x.won).length;
    return `<button type="button" class="pc" aria-pressed="${p.n === pSel}" data-k="${p.n}">
      <div class="ptop"><div><h3>${p.n}</h3><div class="en">${p.co}</div></div><div class="rank">${p.rk}</div></div>
      <div class="kv"><span>Points<b>${p.pts.toLocaleString('en-US')}</b></span><span>2026 titles<b>${w}</b></span><span>Majors<b>${p.gs}</b></span></div>
    </button>`;
  }).join('')}</div>`).join('');
  document.querySelectorAll('.pc').forEach(b => b.onclick = () => { pSel = b.dataset.k; render(); });
  const p = ps.find(x => x.n === pSel), f = finals(p);
  // Show the profile right under the selected player's tour
  $(`.players[data-tour="${p.tour}"]`).after($('#pdetail'));
  $('#pdetail').innerHTML = `<div>
      <p class="eyebrow">World No. ${p.rk} · ${p.tour}</p><h3>${p.n}</h3>
      <p style="margin-top:10px;max-width:52ch">${p.style}</p>
      <dl class="facts">
        <div><dt>Country</dt><dd>${p.co}</dd></div>
        <div><dt>Age</dt><dd class="num">${age(p.b)} <span class="ex">(born ${fmt(p.b)}, ${p.b.slice(0,4)})</span></dd></div>
        <div><dt>Plays</dt><dd>${p.h}</dd></div>
        <div><dt>Ranking points</dt><dd class="num">${p.pts.toLocaleString('en-US')}</dd></div>
        <div><dt>Career major singles titles</dt><dd class="num">${p.gs}</dd></div>
        <div><dt>Racket</dt><dd>${p.racket}</dd></div>
      </dl>
    </div>
    <div class="tablebox">
      <p class="eyebrow" style="margin-bottom:6px">2026 finals (covered events)</p>
      ${f.length ? `<table><thead><tr><th>Tournament</th><th>Result</th><th>Opponent</th><th>Score</th></tr></thead><tbody>${f.map(x => `<tr><td><i class="dot ${x.t.sf}"></i> <a href="season.html#${x.t.id}">${x.t.name}</a> <span class="ex mono">${fmt(x.t.e)}</span></td><td>${x.won ? '<b>Won</b>' : 'Runner-up'}</td><td>${x.o}</td><td class="mono ex">${x.sc}</td></tr>`).join('')}</tbody></table>` : '<p class="ex">No 2026 finals among the tournaments covered on this site.</p>'}
    </div>`;
}
segInit('pSeg', v => { pTour = v; render(); });
render();
</script>
