# Re-fetches the Wikipedia draws and rebuilds the site every 15 minutes, committing only when a draw page changed.
# Between runs, pages of tournaments in progress poll Wikipedia themselves (src/live.js).
name: Refresh draws
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-draws.mjs
      # Only the fetch time changed: nothing new to publish
      - id: diff
        run: |
          if git diff --quiet -I "FETCHED|Generated by" -- src/draws.js; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          node build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh draws from Wikipedia"
          git push
